[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hmda"
version = "0.1.0"
description = "Data loading and modeling code for the ML group project (HMDA mortgage denials)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
